<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>한바구니 픽 — 장바구니 초기화 없는 다중 매장 통합 주문</title>
  <style>
    :root {
      --primary: #008566;
      --primary-dark: #005c46;
      --primary-soft: #e6f7f2;
      --bg: #f3f6f5;
      --surface: #ffffff;
      --line: #d4e0dc;
      --text: #111916;
      --sub: #42544e;
      --danger: #b91c1c;
      --danger-bg: #fef2f2;
      --focus-ring: #1d4ed8;
      --shadow-sm: 0 4px 14px rgba(15, 23, 42, 0.06);
      --shadow-md: 0 14px 32px rgba(15, 23, 42, 0.12);
      --r-lg: 20px;
      --r-md: 14px;

      /* 매장별 고유 컬러 (명도 대비 4.5:1 이상) */
      --a-main: #c2411c;
      --a-dark: #8c2b0f;
      --a-bg: #fff3ee;
      --a-line: #f3bfb0;

      --b-main: #008566;
      --b-dark: #005c46;
      --b-bg: #e7f8f3;
      --b-line: #addfd0;

      --c-main: #5b38e6;
      --c-dark: #3f21b8;
      --c-bg: #f1edff;
      --c-line: #cdc0ff;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard", "Malgun Gothic", sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
      min-height: 100vh;
    }

    :is(a, button, input, select, [tabindex]):focus-visible {
      outline: 3px solid var(--focus-ring);
      outline-offset: 2px;
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        transition-duration: 0.01ms !important;
      }
    }

    .appbar {
      position: sticky;
      top: 0;
      z-index: 40;
      background: rgba(255, 255, 255, 0.97);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--line);
    }

    .appbar-inner {
      max-width: 1280px;
      margin: 0 auto;
      padding: 12px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
    }

    .logo-wrap {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .logo-mark {
      background: linear-gradient(135deg, var(--primary), var(--primary-dark));
      color: #ffffff;
      font-weight: 900;
      font-size: 12px;
      padding: 5px 10px;
      border-radius: 999px;
    }

    .logo-text {
      font-size: 19px;
      font-weight: 900;
    }

    .nav-right {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .step-nav {
      display: flex;
      background: #e6eeeb;
      padding: 4px;
      border-radius: 12px;
      gap: 4px;
    }

    .nav-pill {
      border: none;
      background: transparent;
      color: var(--sub);
      font-size: 13px;
      font-weight: 800;
      padding: 7px 14px;
      border-radius: 9px;
      cursor: pointer;
    }

    .nav-pill.active {
      background: var(--surface);
      color: var(--text);
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
    }

    .reset-btn {
      border: 1.5px solid var(--line);
      background: var(--surface);
      color: var(--text);
      font-size: 13px;
      font-weight: 800;
      padding: 7px 12px;
      border-radius: 10px;
      cursor: pointer;
    }

    .page-wrap {
      max-width: 1280px;
      margin: 0 auto;
      padding: 20px 20px 64px;
    }

    .no-reset-banner {
      background: #e6f7f2;
      border: 1.5px solid #99e2ce;
      color: #004d3b;
      border-radius: 14px;
      padding: 12px 16px;
      margin-bottom: 18px;
      font-size: 14px;
      font-weight: 800;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      flex-wrap: wrap;
    }

    .view {
      display: none;
    }

    .view.active {
      display: block;
    }

    .cart-layout {
      display: grid;
      grid-template-columns: 1.3fr 1fr;
      gap: 20px;
      align-items: start;
    }

    @media (max-width: 980px) {
      .cart-layout {
        grid-template-columns: 1fr;
      }
    }

    .panel {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--r-lg);
      box-shadow: var(--shadow-sm);
      padding: 20px;
    }

    .panel-title {
      font-size: 17px;
      font-weight: 900;
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 12px;
    }

    .store-A { --s-main: var(--a-main); --s-dark: var(--a-dark); --s-bg: var(--a-bg); --s-line: var(--a-line); }
    .store-B { --s-main: var(--b-main); --s-dark: var(--b-dark); --s-bg: var(--b-bg); --s-line: var(--b-line); }
    .store-C { --s-main: var(--c-main); --s-dark: var(--c-dark); --s-bg: var(--c-bg); --s-line: var(--c-line); }

    .color-chip {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--s-main, var(--primary));
      display: inline-block;
    }

    .store-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-bottom: 14px;
    }

    @media (max-width: 640px) {
      .store-grid { grid-template-columns: 1fr; }
    }

    .store-tile {
      border: 1.5px solid var(--s-line);
      border-top: 4px solid var(--s-main);
      border-radius: var(--r-md);
      padding: 13px;
      background: #ffffff;
      cursor: pointer;
      text-align: left;
    }

    .store-tile.active {
      background: var(--s-bg);
      border-color: var(--s-main);
      border-top-width: 5px;
    }

    .store-tile-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 15px;
      font-weight: 900;
      color: var(--s-dark);
    }

    .store-tile-sub {
      font-size: 12px;
      color: var(--sub);
      margin-top: 4px;
    }

    .store-state-tag {
      display: inline-block;
      margin-top: 8px;
      font-size: 11px;
      font-weight: 800;
      padding: 3px 9px;
      border-radius: 999px;
      background: var(--s-bg);
      color: var(--s-dark);
      border: 1px solid var(--s-line);
    }

    .store-tile.active .store-state-tag {
      background: var(--s-main);
      color: #ffffff;
      border-color: var(--s-main);
    }

    .field-label {
      display: block;
      font-size: 13px;
      font-weight: 800;
      color: var(--text);
      margin-bottom: 5px;
    }

    .req-mark {
      color: var(--danger);
      font-weight: 900;
      margin-left: 2px;
    }

    .text-input,
    .styled-select {
      width: 100%;
      padding: 10px 13px;
      border: 1.5px solid var(--line);
      border-radius: 11px;
      font-size: 14px;
      background: #ffffff;
      color: var(--text);
    }

    .text-input[aria-invalid="true"] {
      border-color: var(--danger);
      background: var(--danger-bg);
    }

    .error-text {
      display: block;
      font-size: 12px;
      font-weight: 700;
      color: var(--danger);
      margin-top: 4px;
      min-height: 18px;
    }

    .menu-stack {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .menu-card {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 13px 14px;
      border-radius: var(--r-md);
      border: 1px solid var(--s-line);
      border-left: 4px solid var(--s-main);
      background: #ffffff;
    }

    .menu-main {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .menu-img {
      width: 68px;
      height: 68px;
      border-radius: 14px;
      object-fit: cover;
      border: 1px solid var(--s-line);
      background: var(--s-bg);
      flex-shrink: 0;
    }

    .menu-name-row {
      font-size: 15px;
      font-weight: 800;
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
    }

    .store-pill-mini {
      font-size: 11px;
      font-weight: 800;
      padding: 2px 7px;
      border-radius: 999px;
      background: var(--s-bg);
      color: var(--s-dark);
      border: 1px solid var(--s-line);
    }

    .menu-desc {
      font-size: 12px;
      color: var(--sub);
      margin-top: 2px;
    }

    .menu-price {
      font-size: 14px;
      font-weight: 900;
      color: var(--s-dark);
      margin-top: 5px;
    }

    .add-btn {
      background: var(--s-main);
      color: #ffffff;
      border: none;
      border-radius: 10px;
      padding: 10px 14px;
      font-size: 13px;
      font-weight: 800;
      cursor: pointer;
      white-space: nowrap;
    }

    .cart-store-box {
      border: 1.5px solid var(--s-line);
      border-top: 4px solid var(--s-main);
      border-radius: var(--r-md);
      background: var(--s-bg);
      padding: 12px 14px;
      margin-bottom: 12px;
    }

    .cart-store-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 14px;
      font-weight: 900;
      color: var(--s-dark);
      padding-bottom: 8px;
      border-bottom: 1px dashed var(--s-line);
      margin-bottom: 8px;
      gap: 8px;
    }

    .badge-ok {
      font-size: 11px;
      font-weight: 800;
      padding: 3px 8px;
      border-radius: 999px;
      background: #dcfce7;
      color: #14532d;
      white-space: nowrap;
    }

    .badge-lack {
      font-size: 11px;
      font-weight: 800;
      padding: 3px 8px;
      border-radius: 999px;
      background: #fee2e2;
      color: var(--danger);
      white-space: nowrap;
    }

    .cart-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      padding: 6px 0;
      font-size: 13px;
    }

    .cart-row-left {
      display: flex;
      align-items: center;
      gap: 9px;
    }

    .cart-thumb {
      width: 40px;
      height: 40px;
      border-radius: 10px;
      object-fit: cover;
      border: 1px solid var(--s-line);
      background: #ffffff;
    }

    .stepper {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: #ffffff;
      border: 1px solid var(--s-line);
      border-radius: 9px;
      padding: 3px 7px;
    }

    .step-btn {
      border: none;
      background: transparent;
      font-size: 15px;
      font-weight: 900;
      color: var(--s-dark);
      cursor: pointer;
      padding: 0 5px;
    }

    .form-stack {
      display: flex;
      flex-direction: column;
      gap: 11px;
      margin: 14px 0;
    }

    .bill-box {
      background: #f8faf9;
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 14px;
    }

    .bill-line {
      display: flex;
      justify-content: space-between;
      font-size: 13px;
      color: var(--sub);
      margin-bottom: 6px;
    }

    .bill-total {
      display: flex;
      justify-content: space-between;
      font-size: 17
