<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>한바구니픽 | 여러 맛집 메뉴를 한 번에</title>
  <style>
    :root {
      --primary: #ff5a36;
      --primary-dark: #e04624;
      --bg: #fffaf7;
      --card: #ffffff;
      --text: #1f2421;
      --muted: #6b7280;
      --border: #ece4de;
      --accent-soft: #fff0eb;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans KR", sans-serif;
      background-color: var(--bg);
      color: var(--text);
      line-height: 1.5;
    }

    header {
      background-color: var(--card);
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      z-index: 10;
    }

    .nav-container {
      max-width: 1080px;
      margin: 0 auto;
      padding: 16px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo {
      font-size: 1.35rem;
      font-weight: 800;
      color: var(--primary);
      text-decoration: none;
    }

    .badge {
      font-size: 0.78rem;
      background-color: var(--accent-soft);
      color: var(--primary-dark);
      padding: 6px 12px;
      border-radius: 999px;
      font-weight: 600;
    }

    .hero {
      max-width: 1080px;
      margin: 28px auto 12px;
      padding: 0 20px;
    }

    .hero-box {
      background: linear-gradient(135deg, #fff1eb 0%, #ffe4d9 100%);
      border: 1px solid #ffd4c4;
      border-radius: 20px;
      padding: 28px 24px;
    }

    .hero-box h1 {
      font-size: 1.7rem;
      margin-bottom: 8px;
    }

    .hero-box p {
      color: #4b5563;
      font-size: 0.98rem;
    }

    .main-grid {
      max-width: 1080px;
      margin: 24px auto 60px;
      padding: 0 20px;
      display: grid;
      grid-template-columns: 1.7fr 1fr;
      gap: 24px;
      align-items: start;
    }

    .section-title {
      font-size: 1.15rem;
      font-weight: 700;
      margin-bottom: 14px;
    }

    .menu-list {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 14px;
    }

    .menu-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 12px;
    }

    .store-tag {
      display: inline-block;
      font-size: 0.75rem;
      font-weight: 700;
      color: var(--primary-dark);
      background: var(--accent-soft);
      padding: 4px 8px;
      border-radius: 8px;
      margin-bottom: 6px;
    }

    .menu-name {
      font-size: 1.02rem;
      font-weight: 700;
      margin-bottom: 4px;
    }

    .menu-price {
      font-weight: 600;
      color: var(--text);
    }

    .btn {
      border: none;
      border-radius: 10px;
      padding: 10px 14px;
      font-size: 0.9rem;
      font-weight: 700;
      cursor: pointer;
      transition: background-color 0.15s ease;
    }

    .btn-add {
      background-color: var(--primary);
      color: #fff;
      width: 100%;
    }

    .btn-add:hover {
      background-color: var(--primary-dark);
    }

    .cart-panel {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 20px;
      position: sticky;
      top: 84px;
    }

    .cart-empty {
      color: var(--muted);
      font-size: 0.92rem;
      padding: 24px 0;
      text-align: center;
    }

    .cart-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 0;
      border-bottom: 1px dashed var(--border);
      gap: 10px;
    }

    .cart-item-info strong {
      display: block;
      font-size: 0.95rem;
    }

    .cart-item-info span {
      font-size: 0.8rem;
      color: var(--muted);
    }

    .qty-controls {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .qty-btn {
      width: 26px;
      height: 26px;
      border: 1px solid var(--border);
      background: #fff;
      border-radius: 6px;
      font-weight: 700;
      cursor: pointer;
    }

    .cart-summary {
      margin-top: 16px;
      padding-top: 12px;
      border-top: 2px solid var(--border);
    }

    .summary-row {
      display: flex;
      justify-content: space-between;
      margin-bottom: 8px;
      font-size: 0.95rem;
    }

    .total-row {
      font-size: 1.1rem;
      font-weight: 800;
      color: var(--primary-dark);
      margin-top: 8px;
    }

    .btn-order {
      margin-top: 14px;
      width: 100%;
      background-color: var(--text);
      color: #fff;
    }

    .btn-order:hover {
      background-color: #374151;
    }

    @media (max-width: 820px) {
      .main-grid {
        grid-template-columns: 1fr;
      }

      .cart-panel {
        position: static;
      }
    }
  </style>
</head>
<body>
  <header>
    <div class="nav-container">
      <a href="#" class="logo">🧺 한바구니픽</a>
      <span class="badge">멀티 매장 통합 장바구니 프로토타입</span>
    </div>
  </header>

  <section class="hero">
    <div class="hero-box">
      <h1>서로 다른 가게 메뉴도 한 바구니에 담아요</h1>
      <p>가게마다 따로 주문하지 않고, 원하는 메뉴를 골라 한 번에 합산 금액을 확인해 보세요.</p>
    </div>
  </section>

  <main class="main-grid">
    <section>
      <h2 class="section-title">추천 메뉴</h2>
      <div id="menuList" class="menu-list"></div>
    </section>

    <aside class="cart-panel">
      <h2 class="section-title">내 장바구니 (<span id="storeCount">0</span>개 가게)</h2>
      <div id="cartItems" class="cart-empty">아직 담긴 메뉴가 없어요.</div>
      <div class="cart-summary">
        <div class="summary-row">
          <span>메뉴 금액</span>
          <span id="subtotalText">0원</span>
        </div>
        <div class="summary-row">
          <span>합배송 배달팁 (가게당 1,500원)</span>
          <span id="deliveryFeeText">0원</span>
        </div>
        <div class="summary-row total-row">
          <span>총 결제 예상 금액</span>
          <span id="totalText">0원</span>
        </div>
        <button class="btn btn-order" onclick="handleCheckout()">한 번에 주문하기</button>
      </div>
    </aside>
  </main>

  <script>
    const menus = [
      { id: 1, store: "황금반점", name: "사천짜장", price: 8500 },
      { id: 2, store: "황금반점", name: "미니 탕수육", price: 12000 },
      { id: 3, store: "시원한식당", name: "1인 김치찜", price: 9500 },
      { id: 4, store: "과일청과", name: "생파인애플 스틱", price: 4500 },
      { id: 5, store: "브루잉랩", name: "아이스 아메리카노", price: 3500 }
    ];

    const cart = new Map();

    function formatWon(amount) {
      return amount.toLocaleString("ko-KR") + "원";
    }

    function renderMenus() {
      const container = document.getElementById("menuList");
      container.innerHTML = menus
        .map(
          (item) => `
          <article class="menu-card">
            <div>
              <span class="store-tag">${item.store}</span>
              <div class="menu-name">${item.name}</div>
              <div class="menu-price">${formatWon(item.price)}</div>
            </div>
            <button class="btn btn-add" onclick="addToCart(${item.id})">장바구니 담기</button>
          </article>
        `
        )
        .join("");
    }

    function addToCart(id) {
      const item = menus.find((m) => m.id === id);
      if (!item) return;

      const current = cart.get(id);
      if (current) {
        current.qty += 1;
      } else {
        cart.set(id, { ...item, qty: 1 });
      }
      renderCart();
    }

    function changeQty(id, delta) {
      const current = cart.get(id);
      if (!current) return;

      current.qty += delta;
      if (current.qty <= 0) {
        cart.delete(id);
      }
      renderCart();
    }

    function renderCart() {
      const cartContainer = document.getElementById("cartItems");
      const items = Array.from(cart.values());

      if (items.length === 0) {
        cartContainer.className = "cart-empty";
        cartContainer.textContent = "아직 담긴 메뉴가 없어요.";
      } else {
        cartContainer.className = "";
        cartContainer.innerHTML = items
          .map(
            (item) => `
            <div class="cart-item">
              <div class="cart-item-info">
                <strong>${item.name}</strong>
                <span>${item.store} · ${formatWon(item.price * item.qty)}</span>
              </div>
              <div class="qty-controls">
                <button class="qty-btn" onclick="changeQty(${item.id}, -1)">-</button>
                <span>${item.qty}</span>
                <button class="qty-btn" onclick="changeQty(${item.id}, 1)">+</button>
              </div>
            </div>
          `
          )
          .join("");
      }

      const uniqueStores = new Set(items.map((item) => item.store));
      const subtotal = items.reduce((sum, item) => sum + item.price * item.qty, 0);
      const deliveryFee = uniqueStores.size * 1500;
      const total = subtotal + deliveryFee;

      document.getElementById("storeCount").textContent = uniqueStores.size;
      document.getElementById("subtotalText").textContent = formatWon(subtotal);
      document.getElementById("deliveryFeeText").textContent = formatWon(deliveryFee);
      document.getElementById("totalText").textContent = formatWon(total);
    }

    function handleCheckout() {
      if (cart.size === 0) {
        alert("먼저 메뉴를 담아주세요!");
        return;
      }
      const uniqueStores = new Set(Array.from(cart.values()).map((i) => i.store));
      alert(`총 ${uniqueStores.size}개 가게 메뉴로 주문서가 준비되었습니다!`);
    }

    renderMenus();
    renderCart();
  </script>
</body>
</html>
