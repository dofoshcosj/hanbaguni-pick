<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>한바구니 픽 — 통합 장바구니 및 실시간 배달</title>
  <style>
    :root {
      --primary: #009b77;
      --primary-dark: #006d53;
      --primary-soft: #e6f7f2;
      --bg: #f4f7f6;
      --surface: #ffffff;
      --line: #dce5e2;
      --text: #141c19;
      --sub: #4d5f59;
      --danger: #c91e3a;
      --focus-ring: #1d4ed8;
      --shadow-sm: 0 4px 14px rgba(15, 23, 42, 0.05);
      --shadow-md: 0 12px 30px rgba(15, 23, 42, 0.1);
      --r-lg: 20px;
      --r-md: 14px;
      --r-sm: 10px;

      /* 가게별 고유 컬러 */
      --a-main: #d6532e;
      --a-dark: #9e3518;
      --a-bg: #fff2ed;
      --a-line: #f5c3b3;

      --b-main: #009b77;
      --b-dark: #00684f;
      --b-bg: #e7f8f3;
      --b-line: #b2e5d6;

      --c-main: #6d4aff;
      --c-dark: #4928d6;
      --c-bg: #f2eeff;
      --c-line: #d2c4ff;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard", "Malgun Gothic", sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
      min-height: 100vh;
    }

    :is(a, button, input, select, [tabindex]):focus-visible {
      outline: 3px solid var(--focus-ring);
      outline-offset: 2px;
    }

    /* 상단 앱바 */
    .appbar {
      position: sticky;
      top: 0;
      z-index: 40;
      background: rgba(255, 255, 255, 0.96);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--line);
    }

    .appbar-inner {
      max-width: 1280px;
      margin: 0 auto;
      padding: 12px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
    }

    .logo-wrap {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .logo-mark {
      background: linear-gradient(135deg, var(--primary), var(--primary-dark));
      color: #ffffff;
      font-weight: 900;
      font-size: 13px;
      padding: 5px 10px;
      border-radius: 999px;
    }

    .logo-text {
      font-size: 19px;
      font-weight: 900;
      letter-spacing: -0.02em;
    }

    .nav-right {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .step-nav {
      display: flex;
      background: #eaf0ee;
      padding: 4px;
      border-radius: 12px;
      gap: 4px;
    }

    .nav-pill {
      border: none;
      background: transparent;
      color: var(--sub);
      font-size: 13px;
      font-weight: 800;
      padding: 7px 13px;
      border-radius: 9px;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .nav-pill.active {
      background: var(--surface);
      color: var(--text);
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
    }

    .reset-btn {
      border: 1.5px solid var(--line);
      background: var(--surface);
      color: var(--text);
      font-size: 13px;
      font-weight: 800;
      padding: 7px 12px;
      border-radius: 10px;
      cursor: pointer;
    }

    .reset-btn:hover {
      background: #eef3f1;
    }

    /* 레이아웃 */
    .page-wrap {
      max-width: 1280px;
      margin: 0 auto;
      padding: 20px 20px 64px;
    }

    .view {
      display: none;
    }

    .view.active {
      display: block;
      animation: viewFade 0.2s ease;
    }

    @keyframes viewFade {
      from { opacity: 0; transform: translateY(5px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .cart-layout {
      display: grid;
      grid-template-columns: 1.32fr 1fr;
      gap: 20px;
      align-items: start;
    }

    @media (max-width: 980px) {
      .cart-layout {
        grid-template-columns: 1fr;
      }
    }

    .panel {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--r-lg);
      box-shadow: var(--shadow-sm);
      padding: 20px;
    }

    .panel-title {
      font-size: 17px;
      font-weight: 900;
      letter-spacing: -0.02em;
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 12px;
    }

    /* 가게별 테마 */
    .store-A {
      --s-main: var(--a-main);
      --s-dark: var(--a-dark);
      --s-bg: var(--a-bg);
      --s-line: var(--a-line);
    }

    .store-B {
      --s-main: var(--b-main);
      --s-dark: var(--b-dark);
      --s-bg: var(--b-bg);
      --s-line: var(--b-line);
    }

    .store-C {
      --s-main: var(--c-main);
      --s-dark: var(--c-dark);
      --s-bg: var(--c-bg);
      --s-line: var(--c-line);
    }

    .color-chip {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--s-main, var(--primary));
      display: inline-block;
    }

    /* 매장 탭 */
    .store-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-bottom: 14px;
    }

    @media (max-width: 640px) {
      .store-grid {
        grid-template-columns: 1fr;
      }
    }

    .store-tile {
      border: 1.5px solid var(--s-line);
      border-top: 4px solid var(--s-main);
      border-radius: var(--r-md);
      padding: 13px;
      background: #ffffff;
      cursor: pointer;
      text-align: left;
      transition: all 0.15s ease;
    }

    .store-tile:hover {
      transform: translateY(-2px);
      box-shadow: var(--shadow-sm);
    }

    .store-tile.active {
      background: var(--s-bg);
      border-color: var(--s-main);
      border-top-width: 5px;
    }

    .store-tile-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 15px;
      font-weight: 900;
      color: var(--s-dark);
    }

    .store-tile-sub {
      font-size: 12px;
      color: var(--sub);
      margin-top: 4px;
    }

    .store-state-tag {
      display: inline-block;
      margin-top: 8px;
      font-size: 11px;
      font-weight: 800;
      padding: 3px 9px;
      border-radius: 999px;
      background: var(--s-bg);
      color: var(--s-dark);
      border: 1px solid var(--s-line);
    }

    .store-tile.active .store-state-tag {
      background: var(--s-main);
      color: #ffffff;
      border-color: var(--s-main);
    }

    /* 검색 입력 */
    .field-label {
      display: block;
      font-size: 13px;
      font-weight: 800;
      color: var(--text);
      margin-bottom: 6px;
    }

    .search-box {
      width: 100%;
      padding: 11px 14px;
      border: 1.5px solid var(--line);
      border-radius: 12px;
      font-size: 14px;
      background: #fafcfc;
      margin-bottom: 14px;
      color: var(--text);
    }

    .search-box:focus {
      background: #ffffff;
      border-color: var(--s-main, var(--primary));
    }

    /* 메뉴 리스트 */
    .menu-stack {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .menu-card {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 13px 14px;
      border-radius: var(--r-md);
      border: 1px solid var(--s-line);
      border-left: 4px solid var(--s-main);
      background: #ffffff;
      transition: background 0.15s ease;
    }

    .menu-card:hover {
      background: var(--s-bg);
    }

    .menu-main {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .menu-img {
      width: 68px;
      height: 68px;
      border-radius: 14px;
      object-fit: cover;
      border: 1px solid var(--s-line);
      background: var(--s-bg);
      flex-shrink: 0;
    }

    .menu-name-row {
      font-size: 15px;
      font-weight: 800;
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
    }

    .store-pill-mini {
      font-size: 11px;
      font-weight: 800;
      padding: 2px 7px;
      border-radius: 999px;
      background: var(--s-bg);
      color: var(--s-dark);
      border: 1px solid var(--s-line);
    }

    .menu-desc {
      font-size: 12px;
      color: var(--sub);
      margin-top: 2px;
    }

    .menu-price {
      font-size: 14px;
      font-weight: 900;
      color: var(--s-dark);
      margin-top: 5px;
    }

    .add-btn {
      background: var(--s-main);
      color: #ffffff;
      border: none;
      border-radius: 10px;
      padding: 10px 14px;
      font-size: 13px;
      font-weight: 800;
      cursor: pointer;
      white-space: nowrap;
      transition: background 0.15s ease;
    }

    .add-btn:hover {
      background: var(--s-dark);
    }

    /* 장바구니 그룹 */
    .cart-store-box {
      border: 1.5px solid var(--s-line);
      border-top: 4px solid var(--s-main);
      border-radius: var(--r-md);
      background: var(--s-bg);
      padding: 12px 14px;
      margin-bottom: 12px;
    }

    .cart-store-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 14px;
      font-weight: 900;
      color: var(--s-dark);
      padding-bottom: 8px;
      border-bottom: 1px dashed var(--s-line);
      margin-bottom: 8px;
      gap: 8px;
    }

    .badge-ok {
      font-size: 11px;
      font-weight: 800;
      padding: 3px 8px;
      border-radius: 999px;
      background: #dcfce7;
      color: #14532d;
      white-space: nowrap;
    }

    .badge-lack {
      font-size: 11px;
      font-weight: 800;
      padding: 3px 8px;
      border-radius: 999px;
      background: #ffe4e6;
      color: var(--danger);
      white-space: nowrap;
    }

    .cart-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      padding: 6px 0;
      font-size: 13px;
    }

    .cart-row-left {
      display: flex;
      align-items: center;
      gap: 9px;
    }

    .cart-thumb {
      width: 40px;
      height: 40px;
      border-radius: 10px;
      object-fit: cover;
      border: 1px solid var(--s-line);
      background: #ffffff;
    }

    .stepper {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: #ffffff;
      border: 1px solid var(--s-line);
      border-radius: 9px;
      padding: 3px 7px;
    }

    .step-btn {
      border: none;
      background: transparent;
      font-size: 15px;
      font-weight: 900;
      color: var(--s-dark);
      cursor: pointer;
      padding: 0 5px;
    }

    .select-group {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin: 14px 0;
    }

    .styled-select {
      width: 100%;
      padding: 10px 12px;
      border: 1.5px solid var(--line);
      border-radius: 11px;
      font-size: 13px;
      font-weight: 700;
      background: #ffffff;
      color: var(--text);
    }

    .bill-box {
      background: #f8faf9;
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 14px;
    }

    .bill-line {
      display: flex;
      justify-content: space-between;
      font-size: 13px;
      color: var(--sub);
      margin-bottom: 6px;
    }

    .bill-total {
      display: flex;
      justify-content: space-between;
      font-size: 17px;
      font-weight: 900;
      color: var(--text);
      padding-top: 8px;
      border-top: 1px solid var(--line);
      margin-top: 6px;
    }

    .notice-msg {
      margin-top: 10px;
      font-size: 12px;
      font-weight: 700;
      color: var(--primary-dark);
      min-height: 18px;
    }

    .cta-col {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-top: 12px;
    }

    .cta-primary {
      width: 100%;
      border: none;
      border-radius: 13px;
      padding: 14px 16px;
      font-size: 15px;
      font-weight: 900;
      background: linear-gradient(135deg, var(--primary), var(--primary-dark));
      color: #ffffff;
      cursor: pointer;
      box-shadow: 0 6px 16px rgba(0, 155, 119, 0.24);
    }

    .cta-outline {
      width: 100%;
      border: 1.5px solid var(--primary-dark);
      border-radius: 13px;
      padding: 12px 16px;
      font-size: 14px;
      font-weight: 800;
      background: #ffffff;
      color: var(--primary-dark);
      cursor: pointer;
    }

    .cta-outline:hover {
      background: var(--primary-soft);
    }

    /* 라이더 화면 (배민·쿠팡이츠 스타일 + 줄어드는 타이머) */
    .rider-shell {
      max-width: 780px;
      margin: 0 auto;
    }

    .live-header-card {
      background: linear-gradient(135deg, #0f2922 0%, #164236 100%);
      color: #ffffff;
      border-radius: var(--r-lg);
      padding: 20px;
      margin-bottom: 16px;
      box-shadow: var(--shadow-md);
    }

    .live-top-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .timer-group {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .eta-chip {
      background: var(--primary);
      color: #ffffff;
      font-size: 13px;
      font-weight: 900;
      padding: 5px 12px;
      border-radius: 999px;
      font-variant-numeric: tabular-nums;
    }

    .timer-toggle-btn {
      background: rgba(255, 255, 255, 0.16);
      color: #ffffff;
      border: 1px solid rgba(255, 255, 255, 0.35);
      font-size: 12px;
      font-weight: 800;
      padding: 5px 11px;
      border-radius: 999px;
      cursor: pointer;
    }

    .timer-toggle-btn:hover {
      background: rgba(255, 255, 255, 0.26);
    }

    .live-headline {
      font-size: 20px;
      font-weight: 900;
      margin-top: 10px;
      letter-spacing: -0.02em;
    }

    .live-sub {
      font-size: 13px;
      color: #d1fae5;
      margin-top: 4px;
      font-variant-numeric: tabular-nums;
    }

    .progress-track-wrap {
      margin-top: 16px;
    }

    .progress-bar-bg {
      height: 10px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.2);
      overflow: hidden;
    }

    .progress-bar-fill {
      height: 100%;
      width: 33%;
      border-radius: 999px;
      background: linear-gradient(90deg, var(--a-main), var(--b-main), var(--c-main));
      transition: width 0.3s ease;
    }

    .progress-labels {
      display: flex;
      justify-content: space-between;
      gap: 8px;
      flex-wrap: wrap;
      font-size: 12px;
      color: #f1f5f9;
      margin-top: 8px;
      font-weight: 700;
    }

    .stage-switcher {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 14px;
    }

    .stage-btn {
      border: 1.5px solid var(--line);
      background: #ffffff;
      color: var(--text);
      font-size: 12px;
      font-weight: 800;
      padding: 8px 13px;
      border-radius: 999px;
      cursor: pointer;
    }

    .stage-btn.active {
      background: var(--text);
      color: #ffffff;
      border-color: var(--text);
    }

    .pickup-cards {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 16px;
    }

    .pickup-card {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      padding: 13px 15px;
      border-radius: var(--r-md);
      border: 1.5px solid var(--s-line, var(--line));
      border-left: 5px solid var(--s-main, var(--primary));
      background: var(--s-bg, #f8faf9);
      color: var(--s-dark, var(--text));
      font-size: 13px;
    }

    .state-flag {
      font-size: 11px;
      font-weight: 900;
      padding: 4px 10px;
      border-radius: 999px;
      white-space: nowrap;
    }

    .flag-done {
      background: #dcfce7;
      color: #14532d;
    }

    .flag-now {
      background: #fef3c7;
      color: #78350f;
    }

    .flag-next {
      background: #e2e8f0;
      color: #334155;
    }

    /* 배달완료 화면 */
    .done-shell {
      max-width: 640px;
      margin: 0 auto;
      text-align: center;
    }

    .done-badge {
      width: 66px;
      height: 66px;
      border-radius: 50%;
      background: var(--primary-soft);
      color: var(--primary-dark);
      font-size: 32px;
      font-weight: 900;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 12px;
    }

    .order-receipt {
      text-align: left;
      background: #f8faf9;
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 16px;
      margin: 18px 0;
    }

    .star-row {
      display: flex;
      justify-content: center;
      gap: 8px;
      margin: 10px 0 16px;
    }

    .star-item {
      font-size: 28px;
      border: none;
      background: transparent;
      color: #cbd5e1;
      cursor: pointer;
    }

    .star-item.active,
    .star-item:hover {
      color: #d97706;
    }
  </style>
</head>
<body>
  <header class="appbar">
    <div class="appbar-inner">
      <div class="logo-wrap">
        <span class="logo-mark">PICK</span>
        <span class="logo-text"><span aria-hidden="true">🛒</span> 한바구니 픽</span>
      </div>

      <div class="nav-right">
        <nav class="step-nav" aria-label="주요 화면 전환">
          <button type="button" class="nav-pill active" data-view="cart" onclick="switchView('cart')" aria-current="page">
            <span aria-hidden="true">🛍️</span> 장바구니
          </button>
          <button type="button" class="nav-pill" data-view="rider" onclick="switchView('rider')">
            <span aria-hidden="true">🛵</span> 라이더
          </button>
          <button type="button" class="nav-pill" data-view="done" onclick="switchView('done')">
            <span aria-hidden="true">✅</span> 배달완료
          </button>
        </nav>
        <button type="button" class="reset-btn" onclick="resetDemo()" aria-label="주문 내역 초기화 및 처음부터 시작">
          <span aria-hidden="true">🔄</span> 처음부터
        </button>
      </div>
    </div>
  </header>

  <main class="page-wrap" id="mainContent">
    <!-- 1. 장바구니 화면 -->
    <section id="view-cart" class="view active" aria-labelledby="cartMainTitle">
      <div class="cart-layout">
        <div class="panel">
          <h1 class="panel-title" id="cartMainTitle">1. 매장 선택 및 메뉴 담기</h1>
          <div class="store-grid" id="storeGrid" role="group" aria-label="매장 목록"></div>

          <label for="searchInput" class="field-label">메뉴 검색</label>
          <input
            type="text"
            id="searchInput"
            class="search-box"
            placeholder="메뉴 이름을 검색해 보세요 (예: 김치찜, 아메리카노, 떡볶이)"
            oninput="renderMenuList()"
          />

          <h2 class="panel-title" id="activeStoreHeading"></h2>
          <div class="menu-stack" id="menuList" aria-live="polite"></div>
        </div>

        <div class="panel">
          <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;">
            <h2 class="panel-title" style="margin-bottom:0;">2. 한바구니 통합 장바구니</h2>
            <span id="cartCountTag" class="badge-ok">총 0개</span>
          </div>

          <div id="cartGroups" aria-live="polite"></div>

          <div class="select-group">
            <div>
              <label for="couponSelect" class="field-label">할인 쿠폰 선택</label>
              <select id="couponSelect" class="styled-select" onchange="renderBill()">
                <option value="0">통합 주문 쿠폰 선택 안 함</option>
                <option value="2000">한바구니 2,000원 할인 쿠폰</option>
                <option value="3000">다매장 첫 주문 3,000원 할인</option>
              </select>
            </div>

            <div>
              <label for="deliveryModeSelect" class="field-label">배달 방식 선택</label>
              <select id="deliveryModeSelect" class="styled-select" onchange="renderBill()">
                <option value="bundle">한바구니 묶음 배달 (배달팁 2,500원)</option>
                <option value="express">빠른 순차 픽업 배달 (배달팁 3,500원)</option>
              </select>
            </div>
          </div>

          <div class="bill-box" id="billBox"></div>
          <p class="notice-msg" id="cartNotice" role="status" aria-live="polite"></p>

          <div class="cta-col">
            <button type="button" class="cta-primary" onclick="openRiderFlow()">
              <span aria-hidden="true">🛵</span> 주문하고 라이더 화면 보기
            </button>
            <button type="button" class="cta-outline" onclick="switchView('done')">
              <span aria-hidden="true">✅</span> 배달완료 화면으로 넘어가기
            </button>
          </div>
        </div>
      </div>
    </section>

    <!-- 2. 라이더 화면 -->
    <section id="view-rider" class="view" aria-labelledby="riderMainHeadline">
      <div class="rider-shell">
        <div class="live-header-card">
          <div class="live-top-row">
            <span style="font-size:13px;font-weight:800;"><span aria-hidden="true">🛵</span> 박민수 라이더 · 순차 픽업 배달 중</span>
            <div class="timer-group">
              <span class="eta-chip" id="riderCountdownBadge" aria-live="polite">남은 시간 15:00</span>
              <button type="button" class="timer-toggle-btn" id="timerToggleBtn" onclick="toggleTimer()">
                일시정지
              </button>
            </div>
          </div>
          <h1 class="live-headline" id="riderMainHeadline">A가게에서 픽업 중입니다</h1>
          <p class="live-sub" id="riderSubStatus">실시간 남은 도착 시간이 1초마다 줄어들고 있습니다.</p>

          <div class="progress-track-wrap">
            <div class="progress-bar-bg">
              <div class="progress-bar-fill" id="riderProgressBar"></div>
            </div>
            <div class="progress-labels" id="riderProgressLabels"></div>
          </div>
        </div>

        <div class="panel">
          <h2 class="panel-title">픽업 및 배달 단계 확인</h2>
          <div class="stage-switcher" id="riderStageButtons" role="group" aria-label="배달 진행 단계"></div>
          <div class="pickup-cards" id="riderPickupCards" aria-live="polite"></div>

          <div class="cta-col">
            <button type="button" class="cta-primary" onclick="switchView('done')">
              <span aria-hidden="true">✅</span> 배달완료 화면으로 넘어가기
            </button>
            <button type="button" class="cta-outline" onclick="switchView('cart')">
              <span aria-hidden="true">🛍️</span> 장바구니로 돌아가기
            </button>
          </div>
        </div>
      </div>
    </section>

    <!-- 3. 배달완료 화면 -->
    <section id="view-done" class="view" aria-labelledby="doneHeading">
      <div class="panel done-shell">
        <div class="done-badge" aria-hidden="true">✓</div>
        <h1 style="font-size:22px;font-weight:900;" id="doneHeading">배달이 완료되었습니다</h1>
        <p style="font-size:14px;color:var(--sub);margin-top:4px;">
          주문하신 한바구니 메뉴가 모두 도착했습니다.
        </p>

        <div class="order-receipt" id="doneReceipt"></div>

        <p style="font-size:14px;font-weight:800;" id="ratingPrompt">이번 배달은 어떠셨나요?</p>
        <div class="star-row" id="starRow" role="group" aria-labelledby="ratingPrompt">
          <button type="button" class="star-item active" onclick="rateOrder(1)" aria-label="별점 1점">★</button>
          <button type="button" class="star-item active" onclick="rateOrder(2)" aria-label="별점 2점">★</button>
          <button type="button" class="star-item active" onclick="rateOrder(3)" aria-label="별점 3점">★</button>
          <button type="button" class="star-item active" onclick="rateOrder(4)" aria-label="별점 4점">★</button>
          <button type="button" class="star-item active" onclick="rateOrder(5)" aria-label="별점 5점">★</button>
        </div>

        <div class="cta-col">
          <button type="button" class="cta-primary" onclick="resetDemo()">
            <span aria-hidden="true">🔄</span> 처음부터 다시 주문하기
          </button>
          <button type="button" class="cta-outline" onclick="switchView('rider')">
            <span aria-hidden="true">🛵</span> 라이더 화면 다시 보기
          </button>
        </div>
      </div>
    </section>
  </main>

  <script>
    function svgFood(emoji, c1, c2) {
      const xml = `
        <svg xmlns="http://www.w3.org/2000/svg" width="140" height="140" viewBox="0 0 140 140">
          <defs>
            <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0%" stop-color="${c1}"/>
              <stop offset="100%" stop-color="${c2}"/>
            </linearGradient>
          </defs>
          <rect width="140" height="140" rx="28" fill="url(#bg)"/>
          <circle cx="70" cy="72" r="44" fill="rgba(255,255,255,0.75)"/>
          <text x="70" y="88" font-size="52" text-anchor="middle">${emoji}</text>
        </svg>
      `.trim();
      return "data:image/svg+xml;utf8," + encodeURIComponent(xml);
    }

    const STORES = [
      { id: "A", name: "A가게 (한식)", shortName: "A가게", emoji: "🍲", minOrder: 12000, eta: "약 25분" },
      { id: "B", name: "B가게 (카페)", shortName: "B가게", emoji: "☕", minOrder: 10000, eta: "약 15분" },
      { id: "C", name: "C가게 (분식)", shortName: "C가게", emoji: "🍢", minOrder: 11000, eta: "약 20분" }
    ];

    const MENUS = [
      { id: "m1", storeId: "A", emoji: "🍲", img: svgFood("🍲", "#ffe6de", "#ffc9b8"), name: "묵은지 돼지김치찜 (1인)", desc: "칼칼하고 깊은 맛의 대표 한식 메뉴", price: 14500 },
      { id: "m2", storeId: "A", emoji: "🍳", img: svgFood("🍳", "#fff0d4", "#ffdfa3"), name: "계란말이 추가", desc: "부드럽고 도톰하게 부친 계란말이", price: 4500 },
      { id: "m3", storeId: "A", emoji: "🥓", img: svgFood("🥓", "#ffe2dc", "#ffc2b5"), name: "스팸구이 사리", desc: "노릇하게 구운 스팸 추가", price: 3500 },
      { id: "m4", storeId: "B", emoji: "🧊", img: svgFood("🧊", "#dcf7ef", "#b9ecdc"), name: "아이스 아메리카노", desc: "고소한 원두로 추출한 깔끔한 커피", price: 3800 },
      { id: "m5", storeId: "B", emoji: "🥛", img: svgFood("🥛", "#e7f9f3", "#c8efe2"), name: "바닐라빈 라떼", desc: "진한 에스프레소와 바닐라의 조화", price: 5000 },
      { id: "m6", storeId: "B", emoji: "🍰", img: svgFood("🍰", "#fff2de", "#ffe0b3"), name: "바스크 치즈케이크", desc: "꾸덕하고 진한 풍미의 수제 케이크", price: 6200 },
      { id: "m7", storeId: "C", emoji: "🌶️", img: svgFood("🌶️", "#f0e7ff", "#dccaff"), name: "매콤 국물떡볶이", desc: "쫄깃한 밀떡과 매콤달콤한 국물", price: 7500 },
      { id: "m8", storeId: "C", emoji: "🍤", img: svgFood("🍤", "#f5efff", "#e4d4ff"), name: "바삭 모둠튀김", desc: "김말이, 오징어, 야채튀김 구성", price: 6000 }
    ];

    let state = {
      selectedStoreId: "B",
      cart: { m1: 1, m4: 1, m6: 1 },
      riderStageIdx: 0,
      remainingSeconds: 900,
      timerPaused: false,
      rating: 5
    };

    let timerIntervalId = null;

    function won(n) {
      return Number(n || 0).toLocaleString("ko-KR") + "원";
    }

    function formatCountdown(sec) {
      const safe = Math.max(0, Number(sec || 0));
      const m = String(Math.floor(safe / 60)).padStart(2, "0");
      const s = String(safe % 60).padStart(2, "0");
      return `${m}:${s}`;
    }

    function startCountdownLoop() {
      if (timerIntervalId) clearInterval(timerIntervalId);
      timerIntervalId = setInterval(() => {
        if (state.timerPaused) return;
        if (state.remainingSeconds > 0) {
          state.remainingSeconds -= 1;
          updateCountdownText();
          if (state.remainingSeconds === 0) {
            clearInterval(timerIntervalId);
            switchView("done");
          }
        }
      }, 1000);
    }

    function toggleTimer() {
      state.timerPaused = !state.timerPaused;
      updateCountdownText();
    }

    function updateCountdownText() {
      const badge = document.getElementById("riderCountdownBadge");
      const btn = document.getElementById("timerToggleBtn");
      const sub = document.getElementById("riderSubStatus");
      if (badge) {
        badge.textContent = `남은 시간 ${formatCountdown(state.remainingSeconds)}`;
      }
      if (btn) {
        btn.textContent = state.timerPaused ? "다시 시작" : "일시정지";
      }
      if (sub) {
        sub.textContent = state.timerPaused
          ? "남은 도착 시간 카운트다운이 일시정지되었습니다."
          : "배달이 진행되면서 남은 도착 시간이 줄어들고 있습니다.";
      }
    }

    function switchView(viewName) {
      document.querySelectorAll(".view").forEach((el) => el.classList.remove("active"));
      const target = document.getElementById("view-" + viewName);
      if (target) target.classList.add("active");

      document.querySelectorAll(".nav-pill").forEach((btn) => {
        const isCurrent = btn.dataset.view === viewName;
        btn.classList.toggle("active", isCurrent);
        if (isCurrent) btn.setAttribute("aria-current", "page");
        else btn.removeAttribute("aria-current");
      });

      if (viewName === "rider") {
        renderRiderView();
        startCountdownLoop();
      } else if (viewName === "done") {
        renderDoneReceipt();
      }
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    function selectStore(storeId) {
      state.selectedStoreId = storeId;
      renderStoreGrid();
      renderMenuList();
    }

    function renderStoreGrid() {
      const grid = document.getElementById("storeGrid");
      grid.innerHTML = STORES.map((st) => {
        const active = st.id === state.selectedStoreId;
        return `
          <button
            type="button"
            class="store-tile store-${st.id} ${active ? "active" : ""}"
            aria-pressed="${active}"
            onclick="selectStore('${st.id}')"
          >
            <div class="store-tile-head">
              <span><span aria-hidden="true">${st.emoji}</span> ${st.name}</span>
              <span class="color-chip" aria-hidden="true"></span>
            </div>
            <div class="store-tile-sub">최소 ${won(st.minOrder)} · ${st.eta}</div>
            <span class="store-state-tag">${active ? "선택됨" : "선택하기"}</span>
          </button>
        `;
      }).join("");

      const current = STORES.find((s) => s.id === state.selectedStoreId);
      const heading = document.getElementById("activeStoreHeading");
      heading.className = `panel-title store-${current.id}`;
      heading.innerHTML = `<span class="color-chip" aria-hidden="true"></span><span aria-hidden="true">${current.emoji}</span> ${current.name} 메뉴`;
    }

    function renderMenuList() {
      const q = (document.getElementById("searchInput").value || "").trim().toLowerCase();
      const items = MENUS.filter((m) => {
        const storeMatch = q ? true : m.storeId === state.selectedStoreId;
        const textMatch = !q || m.name.toLowerCase().includes(q) || m.desc.toLowerCase().includes(q);
        return storeMatch && textMatch;
      });

      const box = document.getElementById("menuList");
      if (!items.length) {
        box.innerHTML = `<div style="font-size:13px;color:var(--sub);">검색 결과가 없습니다. 다른 메뉴명을 입력해 보세요.</div>`;
        return;
      }

      box.innerHTML = items
        .map((m) => {
          const st = STORES.find((s) => s.id === m.storeId);
          return `
            <div class="menu-card store-${st.id}">
              <div class="menu-main">
                <img class="menu-img" src="${m.img}" alt="${m.name} 음식 이미지" />
                <div>
                  <div class="menu-name-row">
                    <span><span aria-hidden="true">${m.emoji}</span> ${m.name}</span>
                    ${q ? `<span class="store-pill-mini"><span aria-hidden="true">${st.emoji}</span> ${st.name}</span>` : ""}
                  </div>
                  <div class="menu-desc">${m.desc}</div>
                  <div class="menu-price">${won(m.price)}</div>
                </div>
              </div>
              <button type="button" class="add-btn" onclick="updateQty('${m.id}', 1)" aria-label="${m.name} 장바구니에 담기">
                + 담기
              </button>
            </div>
          `;
        })
        .join("");
    }

    function updateQty(menuId, diff) {
      const targetMenu = MENUS.find((m) => m.id === menuId);
      const next = (state.cart[menuId] || 0) + diff;
      if (next <= 0) delete state.cart[menuId];
      else state.cart[menuId] = next;

      document.getElementById("cartNotice").textContent = targetMenu
        ? `${targetMenu.name} 수량이 ${Math.max(0, next)}개로 변경되었습니다.`
        : "";
      renderCartView();
    }

    function renderCartView() {
      const groupsEl = document.getElementById("cartGroups");
      let totalQty = 0;

      const blocks = STORES.map((st) => {
        const list = MENUS.filter((m) => m.storeId === st.id && (state.cart[m.id] || 0) > 0);
        if (!list.length) return "";

        const subtotal = list.reduce((sum, item) => {
          const qty = state.cart[item.id] || 0;
          totalQty += qty;
          return sum + item.price * qty;
        }, 0);

        const enough = subtotal >= st.minOrder;

        const rows = list
          .map((item) => {
            const qty = state.cart[item.id];
            return `
              <div class="cart-row">
                <div class="cart-row-left">
                  <img class="cart-thumb" src="${item.img}" alt="${item.name} 썸네일" />
                  <div>
                    <strong><span aria-hidden="true">${item.emoji}</span> ${item.name}</strong>
                    <div style="font-size:12px;color:var(--sub);">${won(item.price * qty)}</div>
                  </div>
                </div>
                <div class="stepper">
                  <button type="button" class="step-btn" onclick="updateQty('${item.id}', -1)" aria-label="${item.name} 수량 감소">−</button>
                  <span aria-label="현재 수량">${qty}</span>
                  <button type="button" class="step-btn" onclick="updateQty('${item.id}', 1)" aria-label="${item.name} 수량 증가">+</button>
                </div>
              </div>
            `;
          })
          .join("");

        return `
          <div class="cart-store-box store-${st.id}">
            <div class="cart-store-head">
              <span><span class="color-chip" aria-hidden="true" style="margin-right:6px;"></span><span aria-hidden="true">${st.emoji}</span> ${st.name} · ${won(subtotal)}</span>
              <span class="${enough ? "badge-ok" : "badge-lack"}">
                ${enough ? "최소주문 충족" : won(st.minOrder - subtotal) + " 부족"}
              </span>
            </div>
            ${rows}
          </div>
        `;
      }).filter(Boolean);

      document.getElementById("cartCountTag").textContent = `총 ${totalQty}개`;
      groupsEl.innerHTML = blocks.length
        ? blocks.join("")
        : `<div class="cart-store-box" style="background:#fafcfc;border-color:var(--line);text-align:center;color:var(--sub);">장바구니가 비어 있습니다. 왼쪽에서 메뉴를 담아보세요.</div>`;

      renderBill();
    }

    function calcTotals() {
      let menuSum = 0;
      Object.entries(state.cart).forEach(([id, qty]) => {
        const menu = MENUS.find((m) => m.id === id);
        if (menu && qty > 0) menuSum += menu.price * qty;
      });

      const discount = menuSum > 0 ? Number(document.getElementById("couponSelect").value || 0) : 0;
      const mode = document.getElementById("deliveryModeSelect").value;
      const deliveryFee = menuSum > 0 ? (mode === "express" ? 3500 : 2500) : 0;
      const total = Math.max(0, menuSum - discount + deliveryFee);

      return { menuSum, discount, deliveryFee, total };
    }

    function renderBill() {
      const { menuSum, discount, deliveryFee, total } = calcTotals();
      document.getElementById("billBox").innerHTML = `
        <div class="bill-line"><span>메뉴 금액</span><span>${won(menuSum)}</span></div>
        <div class="bill-line"><span>배달팁</span><span>${won(deliveryFee)}</span></div>
        <div class="bill-line"><span>쿠폰 할인</span><span>-${won(discount)}</span></div>
        <div class="bill-total">
          <span>총 결제 예정 금액</span>
          <span style="color:var(--primary-dark);">${won(total)}</span>
        </div>
      `;
    }

    function getPickupStores() {
      const picked = STORES.filter((s) =>
        MENUS.some((m) => m.storeId === s.id && (state.cart[m.id] || 0) > 0)
      );
      return picked.length >= 2 ? picked : [STORES[0], STORES[1]];
    }

    function buildRiderStages() {
      const stores = getPickupStores();
      const stages = stores.map((st, idx) => ({
        themeId: st.id,
        chipText: `${st.emoji} ${st.shortName}에서 픽업`,
        headline: `${st.shortName}에서 픽업 중입니다`,
        lineText: `${st.emoji} ${st.name}에서 음식 픽업`,
        secondsByStage: Math.max(180, 900 - idx * 300)
      }));

      stages.push({
        themeId: "B",
        chipText: "🏠 고객님께 배달 중",
        headline: "모든 매장 픽업 완료 · 고객님께 배달 중입니다",
        lineText: "🏠 픽업 완료 후 고객님 주소로 배달 중",
        secondsByStage: 240
      });

      return stages;
    }

    function openRiderFlow() {
      state.riderStageIdx = 0;
      const stages = buildRiderStages();
      state.remainingSeconds = stages[0].secondsByStage;
      state.timerPaused = false;
      switchView("rider");
    }

    function setRiderStage(idx) {
      const stages = buildRiderStages();
      state.riderStageIdx = Math.max(0, Math.min(idx, stages.length - 1));
      state.remainingSeconds = stages[state.riderStageIdx].secondsByStage;
      state.timerPaused = false;
      renderRiderView();
    }

    function renderRiderView() {
      const stages = buildRiderStages();
      if (state.riderStageIdx >= stages.length) {
        state.riderStageIdx = stages.length - 1;
      }
      const cur = stages[state.riderStageIdx];
      const pct = Math.round(((state.riderStageIdx + 1) / stages.length) * 100);

      document.getElementById("riderMainHeadline").textContent = cur.headline;
      document.getElementById("riderProgressBar").style.width = `${pct}%`;
      updateCountdownText();

      document.getElementById("riderProgressLabels").innerHTML = stages
        .map((s, idx) => `<span>${idx + 1}. ${s.chipText}</span>`)
        .join("");

      document.getElementById("riderStageButtons").innerHTML = stages
        .map(
          (s, idx) => `
          <button
            type="button"
            class="stage-btn ${idx === state.riderStageIdx ? "active" : ""}"
            aria-pressed="${idx === state.riderStageIdx}"
            onclick="setRiderStage(${idx})"
          >
            ${s.chipText}
          </button>
        `
        )
        .join("");

      document.getElementById("riderPickupCards").innerHTML = stages
        .map((s, idx) => {
          let cls = "flag-next";
          let label = "대기 중";
          if (idx < state.riderStageIdx) {
            cls = "flag-done";
            label = "완료";
          } else if (idx === state.riderStageIdx) {
            cls = "flag-now";
            label = "배달·픽업 중";
          }
          return `
            <div class="pickup-card store-${s.themeId}">
              <span><strong>${idx + 1}단계.</strong> ${s.lineText}</span>
              <span class="state-flag ${cls}">${label}</span>
            </div>
          `;
        })
        .join("");
    }

    function renderDoneReceipt() {
      const { total } = calcTotals();
      const chosen = MENUS.filter((m) => (state.cart[m.id] || 0) > 0);
      const htmlRows = chosen.length
        ? chosen
            .map((m) => {
              const st = STORES.find((s) => s.id === m.storeId);
              return `
                <div style="display:flex;align-items:center;gap:8px;margin-bottom:6px;">
                  <img src="${m.img}" alt="${m.name} 주문 내역 이미지" style="width:30px;height:30px;border-radius:7px;object-fit:cover;" />
                  <span class="store-pill-mini store-${st.id}"><span aria-hidden="true">${st.emoji}</span> ${st.name}</span>
                  <span><span aria-hidden="true">${m.emoji}</span> ${m.name} × ${state.cart[m.id]} (${won(m.price * state.cart[m.id])})</span>
                </div>
              `;
            })
            .join("")
        : `<div>한바구니 통합 주문 내역</div>`;

      document.getElementById("doneReceipt").innerHTML = `
        <div style="font-weight:900;margin-bottom:10px;">주문 내역</div>
        <div style="font-size:13px;color:var(--sub);margin-bottom:10px;">${htmlRows}</div>
        <div style="display:flex;justify-content:space-between;font-weight:900;border-top:1px solid var(--line);padding-top:8px;">
          <span>결제 완료 금액</span>
          <span style="color:var(--primary-dark);">${won(total > 0 ? total : 24800)}</span>
        </div>
      `;
    }

    function rateOrder(stars) {
      state.rating = stars;
      document.querySelectorAll("#starRow .star-item").forEach((btn, idx) => {
        btn.classList.toggle("active", idx < stars);
      });
    }

    function resetDemo() {
      if (timerIntervalId) clearInterval(timerIntervalId);
      state = {
        selectedStoreId: "B",
        cart: { m1: 1, m4: 1, m6: 1 },
        riderStageIdx: 0,
        remainingSeconds: 900,
        timerPaused: false,
        rating: 5
      };
      document.getElementById("searchInput").value = "";
      document.getElementById("couponSelect").value = "0";
      document.getElementById("deliveryModeSelect").value = "bundle";
      document.getElementById("cartNotice").textContent = "초기 상태로 되돌렸습니다.";
      rateOrder(5);
      renderStoreGrid();
      renderMenuList();
      renderCartView();
      switchView("cart");
    }

    renderStoreGrid();
    renderMenuList();
    renderCartView();
  </script>
</body>
</html>
